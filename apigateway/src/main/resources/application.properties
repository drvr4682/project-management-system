spring.application.name=apigateway
server.port=${API_GATEWAY_PORT:8080}

# JWT
jwt.secret=${JWT_SECRET:default_jwt_secret_key_placeholder_32bytes}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Internal Security
gateway.secret=${GATEWAY_SECRET:default_gateway_secret}

# Service URLs
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.project.url=${PROJECT_SERVICE_URL:http://localhost:8082}
services.task.url=${TASK_SERVICE_URL:http://localhost:8083}
services.user.url=${USER_SERVICE_URL:http://localhost:8084}

# Redis — used for JWT blocklist check on every proxied request
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# LOGGING
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.pms.apigateway=INFO
logging.level.reactor.netty.http.client=INFO

# Tracing & Zipkin Configuration
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Actuator web exposure
management.endpoints.web.exposure.include=health,info,prometheus

# Logging pattern with trace and span IDs
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
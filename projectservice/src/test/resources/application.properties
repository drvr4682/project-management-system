spring.application.name=projectservice

# H2 Database config
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security
jwt.secret=test-secret-key-test-secret-key-test-secret-key
jwt.expiration=86400000

gateway.secret=test-gateway-secret

internal.secret=testinternalkeytestinternalkey12

# LOGGING
logging.level.root=INFO

# Feign - fast timeouts for tests
feign.client.config.default.connectTimeout=1000
feign.client.config.default.readTimeout=1000

# Feign
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}

# ==============================================================
# RESILIENCE4J - test-tuned values (fast, deterministic)
# ==============================================================

# Circuit Breaker: open immediately after 1 failure in a window of 1
resilience4j.circuitbreaker.instances.authService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.authService.slidingWindowSize=1
resilience4j.circuitbreaker.instances.authService.minimumNumberOfCalls=1
resilience4j.circuitbreaker.instances.authService.failureRateThreshold=100
resilience4j.circuitbreaker.instances.authService.waitDurationInOpenState=1s
resilience4j.circuitbreaker.instances.authService.permittedNumberOfCallsInHalfOpenState=1
resilience4j.circuitbreaker.instances.authService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Retry: only 1 attempt (no retries in tests — avoids slow waits)
resilience4j.retry.instances.authService.maxAttempts=1
resilience4j.retry.instances.authService.waitDuration=0ms
# Do NOT retry on these known exceptions — they're not transient failures
resilience4j.retry.instances.authService.ignoreExceptions[0]=com.pms.projectservice.exception.ServiceUnavailableException
resilience4j.retry.instances.authService.ignoreExceptions[1]=java.lang.IllegalArgumentException

# Circuit breaker: ignore known input errors (404, 400) — they shouldn't open the breaker
resilience4j.circuitbreaker.instances.authService.ignoreExceptions[0]=java.lang.IllegalArgumentException

# Time Limiter: generous for test environment
resilience4j.timelimiter.instances.authService.timeoutDuration=5s

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

spring.main.allow-bean-definition-overriding=true

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.application.name=projectservice
server.port=8082

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/project_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}

# Internal security (shared secret for service-to-service calls)
internal.secret=${INTERNAL_SECRET}

# Service URLs - override per environment via env vars
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
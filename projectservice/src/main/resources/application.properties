spring.application.name=projectservice
server.port=8082

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/project_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Internal security (shared secret for service-to-service calls)
internal.secret=${INTERNAL_SECRET}

# Service URLs — override per environment via env vars
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.project.url=${PROJECT_SERVICE_URL:http://localhost:8082}

# Logging
logging.level.root=INFO
logging.level.com.pms.projectservice=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
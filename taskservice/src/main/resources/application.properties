spring.application.name=taskservice
server.port=${TASK_SERVICE_PORT}

# Database
spring.datasource.url=${TASK_DB_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Internal Gateway Security
gateway.secret=${GATEWAY_SECRET}

# Internal security (shared secret for service-to-service calls)
internal.secret=${INTERNAL_SECRET}

# Service URLs
services.auth.url=${AUTH_SERVICE_URL}
services.project.url=${PROJECT_SERVICE_URL}

# FEIGN TIMEOUTS
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=3000

# RESILIENCE4J CIRCUIT BREAKER - authService
resilience4j.circuitbreaker.instances.authService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.authService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.authService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.authService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.authService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.authService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.authService.automaticTransitionFromOpenToHalfOpenEnabled=true

# RESILIENCE4J CIRCUIT BREAKER - projectService
resilience4j.circuitbreaker.instances.projectService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.projectService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.projectService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.projectService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.projectService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.projectService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.projectService.automaticTransitionFromOpenToHalfOpenEnabled=true

# RESILIENCE4J RETRY
resilience4j.retry.instances.authService.maxAttempts=3
resilience4j.retry.instances.authService.waitDuration=2s
resilience4j.retry.instances.projectService.maxAttempts=3
resilience4j.retry.instances.projectService.waitDuration=2s

# RESILIENCE4J TIMELIMITER
resilience4j.timelimiter.instances.authService.timeoutDuration=2s
resilience4j.timelimiter.instances.projectService.timeoutDuration=2s

# ACTUATOR
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

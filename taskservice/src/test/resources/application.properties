spring.application.name=taskservice
server.port=0

# H2 in-memory for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-key-test-secret-key-test-secret-key
jwt.expiration=86400000

gateway.secret=test-gateway-secret

internal.secret=testinternalkeytestinternalkey12

services.auth.url=http://localhost:8081
services.project.url=http://localhost:8082

# Disable Resilience4j actuator for tests
management.health.circuitbreakers.enabled=false

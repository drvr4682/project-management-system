spring.application.name=authservice

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA — H2 dialect auto-detected; recreate schema on each test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Allow bean overriding needed by some test slices
spring.main.allow-bean-definition-overriding=true

# JWT — access token (secret must be at least 32 bytes for HS256)
jwt.secret=test-secret-key-test-secret-key-test-secret-key
jwt.expiration=86400000

# JWT — refresh token (short for integration tests: 1 hour)
jwt.refresh-expiration=3600000

# Secrets used by filters
gateway.secret=test-gateway-secret
internal.secret=testinternalkeytestinternalkey12

# Redis — use embedded/test Redis (or mock bean — see test config)
spring.data.redis.host=localhost
spring.data.redis.port=6370

# Suppress Spring Security auto-config noise in test output
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
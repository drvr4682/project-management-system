spring.application.name=authservice
server.port=${AUTH_SERVICE_PORT:8081}

# Database
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT - access token
jwt.secret=${JWT_SECRET:default_jwt_secret}
jwt.expiration=${JWT_EXPIRATION:86400000}

# JWT - refresh token (default 7 days)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Gateway & Internal Security
gateway.secret=${GATEWAY_SECRET:default_gateway_secret}
internal.secret=${INTERNAL_SECRET:default_internal_secret}

# Redis - used for the JWT blocklist (logout invalidation)
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# MAIL (Gmail SMTP — App Password required; no default value so app fails fast if missing)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# EMAIL VERIFICATION token TTL in minutes (default 24 hours)
app.email-verification.token-expiry-minutes=${EMAIL_VERIFICATION_EXPIRY_MINUTES:1440}

# Public base URL used to build clickable links in verification emails
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# PASSWORD RESET token TTL in minutes (default 30 minutes)
app.password-reset.token-expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:30}
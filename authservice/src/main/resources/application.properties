spring.application.name=authservice
server.port=${AUTH_SERVICE_PORT:8081}

# Database
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:default_jwt_secret}
jwt.expiration=${JWT_EXPIRATION:86400000}

# JWT — refresh token (default 7 days)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Gateway & Internal Security
gateway.secret=${GATEWAY_SECRET:default_gateway_secret}
internal.secret=${INTERNAL_SECRET:default_internal_secret}
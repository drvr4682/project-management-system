# ============================================================
# CD Pipeline — Project Management System (DockerHub Publish)
# ============================================================
#
# Jobs:
#   1. build-push-images  → Log in to DockerHub and build & push all 6 images
#
# Triggers:
#   - Push to main branch ONLY (excluding markdown/documentation)
#   - Manual trigger (workflow_dispatch) to republish images
# ============================================================

name: Publish Docker Images

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

# Cancel any in-progress run for the same branch
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-push-images:
    name: "Build & Push Docker images"
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Auth Service Build & Push
      - name: Build & Push authservice image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: authservice/Dockerfile
          push: true
          tags: |
            drvr4682/pms-authservice:latest
            drvr4682/pms-authservice:${{ github.sha }}
          cache-from: type=gha,scope=authservice
          cache-to: type=gha,mode=max,scope=authservice

      # 2. User Service Build & Push
      - name: Build & Push userservice image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: userservice/Dockerfile
          push: true
          tags: |
            drvr4682/pms-userservice:latest
            drvr4682/pms-userservice:${{ github.sha }}
          cache-from: type=gha,scope=userservice
          cache-to: type=gha,mode=max,scope=userservice

      # 3. Project Service Build & Push
      - name: Build & Push projectservice image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projectservice/Dockerfile
          push: true
          tags: |
            drvr4682/pms-projectservice:latest
            drvr4682/pms-projectservice:${{ github.sha }}
          cache-from: type=gha,scope=projectservice
          cache-to: type=gha,mode=max,scope=projectservice

      # 4. Task Service Build & Push
      - name: Build & Push taskservice image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: taskservice/Dockerfile
          push: true
          tags: |
            drvr4682/pms-taskservice:latest
            drvr4682/pms-taskservice:${{ github.sha }}
          cache-from: type=gha,scope=taskservice
          cache-to: type=gha,mode=max,scope=taskservice

      # 5. API Gateway Build & Push
      - name: Build & Push apigateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apigateway/Dockerfile
          push: true
          tags: |
            drvr4682/pms-apigateway:latest
            drvr4682/pms-apigateway:${{ github.sha }}
          cache-from: type=gha,scope=apigateway
          cache-to: type=gha,mode=max,scope=apigateway

      # 6. Frontend Build & Push
      - name: Build & Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            drvr4682/pms-frontend:latest
            drvr4682/pms-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # 7. Log out of DockerHub
      - name: Log out of DockerHub
        if: always()
        run: docker logout

# ============================================================
# CI Pipeline — Project Management System
# ============================================================
#
# STAGE ORDER (each stage must pass before the next starts):
#
#   1. test-common        → run tests for the shared library
#   2. install-common     → install common jar into Maven cache
#   3. test-authservice   → run authservice tests (needs common)
#   4. test-projectservice→ run projectservice tests (needs common)
#   5. test-taskservice   → run taskservice tests (needs common)
#   6. test-apigateway    → run apigateway tests (needs common)
#   7. build-images       → docker build all 4 service images (needs all tests)
#
# Triggers: push or PR to main or develop
# ============================================================

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# Cancel any in-progress run for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# STAGE 1 — Test common library
# ============================================================
jobs:

  test-common:
    name: "1 · Test common"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          # Cache the local Maven repository between runs
          cache: maven

      - name: Run common tests
        run: mvn -f common/pom.xml clean test -q

      - name: Upload common test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-test-report
          path: common/target/surefire-reports/
          retention-days: 7


  # ============================================================
  # STAGE 2 — Install common into Maven cache
  #           (services depend on common-0.0.1-SNAPSHOT.jar)
  # ============================================================

  install-common:
    name: "2 · Install common to local repo"
    runs-on: ubuntu-latest
    needs: test-common   # only runs if Stage 1 passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install common jar (skip tests — already passed in Stage 1)
        run: mvn -f common/pom.xml install -DskipTests -q

      # Save the installed jar so Stage 3–6 jobs can restore it
      # without re-building common from scratch on each parallel runner.
      - name: Cache installed common jar
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/com/pms/common
          key: common-jar-${{ github.sha }}


  # ============================================================
  # STAGE 3–6 — Test each service (run in parallel, all need
  #             Stage 2 to finish first)
  # ============================================================

  test-authservice:
    name: "3 · Test authservice"
    runs-on: ubuntu-latest
    needs: install-common   # waits for Stage 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Restore the common jar installed in Stage 2
      - name: Restore common jar from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/pms/common
          key: common-jar-${{ github.sha }}

      # authservice tests use H2 (in-memory) for DB and a non-existent
      # Redis port (6370). The JwtAuthenticationFilter handles Redis
      # connection failures gracefully — no real Redis needed.
      - name: Run authservice tests
        run: mvn -f authservice/pom.xml clean test -q

      - name: Upload authservice test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authservice-test-report
          path: authservice/target/surefire-reports/
          retention-days: 7


  test-projectservice:
    name: "4 · Test projectservice"
    runs-on: ubuntu-latest
    needs: install-common

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Restore common jar from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/pms/common
          key: common-jar-${{ github.sha }}

      # projectservice tests use H2, WireMock for Feign stubs,
      # and H2 in-memory — no real Postgres or Redis needed.
      - name: Run projectservice tests
        run: mvn -f projectservice/pom.xml clean test -q

      - name: Upload projectservice test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projectservice-test-report
          path: projectservice/target/surefire-reports/
          retention-days: 7


  test-taskservice:
    name: "5 · Test taskservice"
    runs-on: ubuntu-latest
    needs: install-common

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Restore common jar from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/pms/common
          key: common-jar-${{ github.sha }}

      # taskservice tests use H2 and WireMock — no external services needed.
      - name: Run taskservice tests
        run: mvn -f taskservice/pom.xml clean test -q

      - name: Upload taskservice test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskservice-test-report
          path: taskservice/target/surefire-reports/
          retention-days: 7


  test-apigateway:
    name: "6 · Test apigateway"
    runs-on: ubuntu-latest
    needs: install-common

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Restore common jar from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/pms/common
          key: common-jar-${{ github.sha }}

      # apigateway tests use MockMvc — no real downstream services needed.
      # Redis on port 6370 is gracefully skipped by JwtAuthenticationFilter.
      - name: Run apigateway tests
        run: mvn -f apigateway/pom.xml clean test -q

      - name: Upload apigateway test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apigateway-test-report
          path: apigateway/target/surefire-reports/
          retention-days: 7


  # ============================================================
  # STAGE 7 — Build Docker images
  #           Only runs after ALL 4 service tests pass.
  # ============================================================

  build-images:
    name: "7 · Build Docker images"
    runs-on: ubuntu-latest
    needs:                      # ALL of these must pass first
      - test-authservice
      - test-projectservice
      - test-taskservice
      - test-apigateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build authservice image
      # Context is repo root (matches the Dockerfile COPY paths)
      - name: Build authservice image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: authservice/Dockerfile
          push: false
          tags: pms-authservice:${{ github.sha }}
          cache-from: type=gha,scope=authservice
          cache-to: type=gha,mode=max,scope=authservice

      # Build projectservice image
      - name: Build projectservice image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: projectservice/Dockerfile
          push: false
          tags: pms-projectservice:${{ github.sha }}
          cache-from: type=gha,scope=projectservice
          cache-to: type=gha,mode=max,scope=projectservice

      # Build taskservice image
      - name: Build taskservice image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: taskservice/Dockerfile
          push: false
          tags: pms-taskservice:${{ github.sha }}
          cache-from: type=gha,scope=taskservice
          cache-to: type=gha,mode=max,scope=taskservice

      # Build apigateway image
      - name: Build apigateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apigateway/Dockerfile
          push: false
          tags: pms-apigateway:${{ github.sha }}
          cache-from: type=gha,scope=apigateway
          cache-to: type=gha,mode=max,scope=apigateway
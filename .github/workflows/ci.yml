# ============================================================
# CI Pipeline — Project Management System
# ============================================================
#
# STAGE ORDER (each stage must pass before the next starts):
#
#   1. test-common        → run tests for the shared library
#   2. install-common     → install common jar into Maven cache
#   3. test-authservice   → run authservice tests (needs common)
#   4. test-projectservice→ run projectservice tests (needs common)
#   5. test-taskservice   → run taskservice tests (needs common)
#   6. test-apigateway    → run apigateway tests (needs common)
#   7. test-userservice   → run userservice tests (needs common)
#   8. test-frontend      → lint and build frontend assets
#
# Triggers: push or PR to main or develop
# ============================================================

name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Cancel any in-progress run for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# STAGE 1 — Test common library
# ============================================================
jobs:

  test-common:
    name: "1 · Test common"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          # Cache the local Maven repository between runs
          cache: maven

      - name: Run common tests
        run: mvn -f common/pom.xml clean test -q

      - name: Upload common test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: common-test-report
          path: common/target/surefire-reports/
          retention-days: 7


  # ============================================================
  # STAGE 2 — Install common into Maven cache
  #           (services depend on common-0.0.1-SNAPSHOT.jar)
  # ============================================================

  install-common:
    name: "2 · Install common to local repo"
    runs-on: ubuntu-latest
    needs: test-common   # only runs if Stage 1 passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Install common jar (skip tests — already passed in Stage 1)
        run: mvn -f common/pom.xml install -DskipTests -q

      # Save the installed jar so Stage 3–7 jobs can restore it
      # without re-building common from scratch on each parallel runner.
      - name: Cache installed common jar
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/com/pms/common
          key: common-jar-${{ github.sha }}


  # ============================================================
  # STAGE 3–7 — Test each service in parallel
  #             (all need Stage 2 to finish first)
  # ============================================================

  test-authservice:
    name: "3 · Test authservice"
    runs-on: ubuntu-latest
    needs: install-common   # waits for Stage 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Restore the common jar installed in Stage 2
      - name: Restore common jar from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/pms/common
          key: common-jar-${{ github.sha }}

      - name: Run authservice tests
        run: mvn -f authservice/pom.xml clean test -q

      - name: Upload authservice test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authservice-test-report
          path: authservice/target/surefire-reports/
          retention-days: 7


  test-projectservice:
    name: "4 · Test projectservice"
    runs-on: ubuntu-latest
    needs: install-common

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Restore common jar from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/pms/common
          key: common-jar-${{ github.sha }}

      - name: Run projectservice tests
        run: mvn -f projectservice/pom.xml clean test -q

      - name: Upload projectservice test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projectservice-test-report
          path: projectservice/target/surefire-reports/
          retention-days: 7


  test-taskservice:
    name: "5 · Test taskservice"
    runs-on: ubuntu-latest
    needs: install-common

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Restore common jar from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/pms/common
          key: common-jar-${{ github.sha }}

      - name: Run taskservice tests
        run: mvn -f taskservice/pom.xml clean test -q

      - name: Upload taskservice test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskservice-test-report
          path: taskservice/target/surefire-reports/
          retention-days: 7


  test-apigateway:
    name: "6 · Test apigateway"
    runs-on: ubuntu-latest
    needs: install-common

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Restore common jar from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/pms/common
          key: common-jar-${{ github.sha }}

      - name: Run apigateway tests
        run: mvn -f apigateway/pom.xml clean test -q

      - name: Upload apigateway test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apigateway-test-report
          path: apigateway/target/surefire-reports/
          retention-days: 7


  test-userservice:
    name: "7 · Test userservice"
    runs-on: ubuntu-latest
    needs: install-common

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Restore common jar from cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/com/pms/common
          key: common-jar-${{ github.sha }}

      - name: Run userservice tests
        run: mvn -f userservice/pom.xml clean test -q

      - name: Upload userservice test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: userservice-test-report
          path: userservice/target/surefire-reports/
          retention-days: 7


  # ============================================================
  # STAGE 8 — Test & lint React Frontend
  # ============================================================

  test-frontend:
    name: "8 · Test frontend"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run eslint checks
        run: npm run lint --prefix frontend

      - name: Run frontend compile / build
        run: npm run build --prefix frontend